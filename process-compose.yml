version: "0.1"

processes:
  solr:
    command: mkdir -p solr/data && solr start -s $(pwd)/solr/data -Dsolr.modules=analysis-extras -p ${SOLR_PORT:-8983}
    is_daemon: true
    shutdown:
      command: solr stop
    environment:
      - "SOLR_LOGS_DIR=${PWD}/log"
    liveness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: "/solr/"
        port: ${SOLR_PORT:-8983}
